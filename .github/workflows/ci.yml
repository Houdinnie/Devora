name: CI

on:
  push:
    branches: [main, devora-v2-security-baseline, devora-v2-orchestration, devora-v2-workspace-final]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund --include=optional
      - name: Ensure Rollup native binary is installed
        run: |
          ROLLUP_VERSION=$(node -p "require('./node_modules/rollup/package.json').version")
          npm install --no-save --no-package-lock --no-audit --no-fund "@rollup/rollup-linux-x64-gnu@$ROLLUP_VERSION"
      - name: Type-check
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
