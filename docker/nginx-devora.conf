# Devora Nginx Reverse Proxy Configuration
# Follows OpenClaw security best practices
# CRITICAL: Never expose port 18789 directly to the internet

upstream devora_backend {
    server 127.0.0.1:18789;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=devora:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name devora.yourdomain.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Basic authentication
    auth_basic "Devora Gateway";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        # Rate limiting
        limit_req zone=devora burst=20 nodelay;
        limit_req_log_level warn;

        # Proxy to Devora
        proxy_pass http://devora_backend/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }

    # Health check endpoint (no auth required for monitoring)
    location /health {
        proxy_pass http://devora_backend/health;
        auth_basic off;
    }

    # WebSocket support
    location /ws {
        proxy_pass http://devora_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name devora.yourdomain.com;
    return 301 https://$server_name$request_uri;
}